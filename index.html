<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0A1C">
<title>Find a Garba Partner · Modulus Seventeen</title>
<meta name="description" content="Find your Garba partner this Navratri. A free game by Modulus Seventeen.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<script>
  // Asset paths below are relative, so the page works at a site root (garba-promotion.vercel.app/)
  // and inside a folder. Served as "/garba" with no trailing slash, they would resolve from the
  // site root, so point the base at the folder instead.
  (function () {
    var p = location.pathname;
    if (p !== '/' && !/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) {
      var b = document.createElement('base'); b.href = p + '/'; document.head.appendChild(b);
    }
  })();
</script>
<link rel="preload" as="image" href="assets/noise-airwave-max-4-cut.webp">
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
<div class="app gridbg" id="app">
  <!-- twinkling lights -->
  <div class="lights" aria-hidden="true">
    <span class="lite g" style="left:2%;top:18%"></span>
    <span class="lite p" style="left:3%;top:34%"></span>
    <span class="lite g" style="left:1.5%;top:55%"></span>
    <span class="lite p" style="left:2.5%;top:78%"></span>
    <span class="lite g" style="right:2%;top:24%"></span>
    <span class="lite p" style="right:3%;top:44%"></span>
    <span class="lite g" style="right:1.5%;top:64%"></span>
    <span class="lite p" style="right:2.5%;top:88%"></span>
  </div>

  <!-- pinned top: bunting + logo/back + progress -->
  <div class="topbar gridbg" id="topbar">
    <!-- bunting -->
    <svg class="bunting" aria-hidden="true" width="100%" height="36" preserveAspectRatio="none">
      <defs>
        <pattern id="flags" width="117" height="36" patternUnits="userSpaceOnUse">
          <polygon points="0,0 39,0 19.5,30" fill="#FFF1DC"/>
          <polygon points="39,0 78,0 58.5,30" fill="#FF7A1A"/>
          <polygon points="78,0 117,0 97.5,30" fill="#FF3D8B"/>
          <circle cx="39" cy="6" r="5" fill="#FFB81C"/><circle cx="78" cy="6" r="5" fill="#FFB81C"/><circle cx="117" cy="6" r="5" fill="#FFB81C"/><circle cx="0" cy="6" r="5" fill="#FFB81C"/>
          <circle cx="39" cy="6" r="1.8" fill="#C8105A"/><circle cx="78" cy="6" r="1.8" fill="#C8105A"/><circle cx="117" cy="6" r="1.8" fill="#C8105A"/><circle cx="0" cy="6" r="1.8" fill="#C8105A"/>
        </pattern>
      </defs>
      <rect width="100%" height="36" fill="url(#flags)"/>
    </svg>
    <header class="top" id="top"></header>
    <div class="prog-slot" id="prog"></div>
  </div>
  <main class="body" id="screen" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js?v=19"></script>
</body>
</html>
